site_name: Dynamic DES
site_description: Real-time SimPy simulations that take parameter changes while they run and write their events and telemetry to streams, databases, files and Iceberg tables.
# Every version's pages name the same page under latest/ as canonical, so search
# engines index one copy rather than one per release.
site_url: https://jaehyeon.me/dynamic-des/latest/
repo_url: https://github.com/jaehyeon-kim/dynamic-des
repo_name: dynamic-des

theme:
  name: material
  favicon: assets/favicon.png
  logo: assets/favicon.png
  palette:
    - scheme: default
      primary: black
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  highlightjs: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_root_full_path: false # Removes 'dynamic_des.core...' prefix
            show_root_toc_entry: true # Ensures class appears in TOC
            show_root_heading: true # Shows the class name as a heading
            show_category_heading: true # Groups methods, attributes, etc.
            # The constructor arguments belong under the class, not in a separate
            # "Functions" entry called __init__, which tells a reader nothing.
            merge_init_into_class: true
            # The default filter hides _private but not dunders, so __init__ and its
            # siblings appeared in the page. This hides every underscore name.
            filters: ["!^_"]
            docstring_section_style: table

extra:
  version:
    provider: mike
  # Same property as the blog, so both sit in one view. Filter by /dynamic-des/.
  analytics:
    provider: google
    property: G-076N8WCGWZ

# Files the documentation shows and the tests build. They are not pages.
exclude_docs: |
  snippets/

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Tutorials:
      - "Part 1: Low-level API": tutorials/low-level.md
      - "Part 2: Declarative API": tutorials/declarative.md
      - "Part 3: YAML": tutorials/yaml.md
  - Core Architecture:
      - Overview: architecture/overview.md
      - Writing a Simulation:
          - Low-level API: architecture/low-level.md
          - Declarative API: architecture/context.md
          - YAML Blueprints: architecture/yaml.md
      - Runtime:
          - Realtime Environment: architecture/environment.md
          - Registry and Live Parameters: architecture/registry.md
          - Time: architecture/time.md
          - Resources and Containers: architecture/resources.md
          - Connectors: architecture/connectors.md
          - Records and Telemetry: architecture/records.md
          - Batching and Delivery: architecture/batching.md
  - Guides:
      - Connectors:
          - Complex Routing (Kafka): guides/complex-routing.md
          - Advanced Serialization (Avro and Pydantic): guides/avro-and-pydantic.md
          - Connecting to Secure Kafka: guides/kafka-security.md
      - Features:
          - Backfill Then Go Live in One Run: guides/backfill-then-live.md
          - Change Parameters While a Simulation Runs: guides/live-parameters.md
      - YAML:
          - YAML Blueprints, from First File to Connectors: guides/yaml-blueprints.md
  - Advanced:
      - "Advanced YAML: Custom Logic with !python": guides/yaml-advanced.md
      - Multi-Resource Handoffs (Hybrid Pattern): guides/multi-resource-handoffs.md
      - Preemptive Machine Breakdowns (Hybrid Pattern): guides/preemptive-breakdowns.md
      - Absolute Edge Cases (Dynamic Topology): guides/dynamic-topology.md
  - Examples:
      - Local Simulation: examples/local.md
      - Kafka Digital Twin: examples/kafka.md
      - Fast-Forward to Parquet: examples/parquet.md
      - Fast-Forward to Iceberg: examples/iceberg.md
      - Relational DB (Postgres): examples/postgres.md
      - In-Memory Store (Redis): examples/redis.md
      - Backfill Then Go Live: examples/backfill-live.md
      - Orders with Line Items (Advanced YAML): examples/advanced-postgres-orders.md
  - API Reference: api.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
