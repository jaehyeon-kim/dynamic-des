name: Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pages: write

jobs:
  unit-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

      - name: Run Unit Tests
        run: uv run --with pytest-cov --all-extras pytest tests/unit/ --cov=src/dynamic_des --cov-report=xml

  integration-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python 3.10
        run: uv python install 3.10

      # Example and test infrastructure comes from odctl, which the conftest
      # drives with `odctl up` and `odctl down`. Without it on PATH every
      # container-backed test skips instead of failing, so the job would pass
      # while testing nothing.
      - name: Install odctl
        run: |
          uv tool install odctl
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"

      - name: Run Integration Tests
        # Run tests/integration on a single baseline version
        run: uv run --all-extras pytest tests/integration/

      # - name: Upload coverage reports to Codecov
      #   uses: codecov/codecov-action@v4
      #   with:
      #     token: ${{ secrets.CODECOV_TOKEN }}
      #     file: ./coverage.xml

  # Each leg installs exactly one extra into an empty environment, then imports and
  # constructs the connectors that extra exists to enable. Running the suite with
  # --all-extras hides a missing transitive dependency in one extra, because another
  # extra supplies it. None of these constructors open a socket, so no broker,
  # registry or database is needed.
  extras-isolation:
    name: Import ${{ matrix.extra }} extra alone
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - extra: kafka
            check: |
              from dynamic_des import KafkaAdminConnector, KafkaEgress, KafkaIngress

              KafkaEgress(bootstrap_servers="localhost:9092")
              KafkaIngress(topic="sim-config", bootstrap_servers="localhost:9092")
              KafkaAdminConnector(bootstrap_servers="localhost:9092")
          - extra: confluent
            check: |
              import json

              from dynamic_des.connectors.egress.kafka import ConfluentAvroSerializer
              from dynamic_des.connectors.ingress.kafka import ConfluentAvroDeserializer

              schema = json.dumps(
                  {
                      "type": "record",
                      "name": "Ping",
                      "fields": [{"name": "value", "type": "double"}],
                  }
              )
              ConfluentAvroSerializer(registry_url="http://localhost:8081", schema_str=schema)
              ConfluentAvroDeserializer(registry_url="http://localhost:8081")
          - extra: glue
            check: |
              import json

              from dynamic_des.connectors.egress.kafka import GlueAvroSerializer
              from dynamic_des.connectors.ingress.kafka import GlueAvroDeserializer

              schema = json.dumps(
                  {
                      "type": "record",
                      "name": "Ping",
                      "fields": [{"name": "value", "type": "double"}],
                  }
              )
              GlueAvroSerializer(registry_name="sim-registry", schema_str=schema)
              GlueAvroDeserializer(registry_name="sim-registry")
          - extra: redis
            check: |
              from dynamic_des import RedisEgress, RedisIngress

              RedisEgress(url="redis://localhost:6379/0")
              RedisIngress(url="redis://localhost:6379/0")
          - extra: postgres
            check: |
              from dynamic_des import PostgresEgress, PostgresIngress

              PostgresEgress(connection_dsn="postgresql://user:pass@localhost:5432/sim")
              PostgresIngress(connection_dsn="postgresql://user:pass@localhost:5432/sim")
          - extra: parquet
            check: |
              from dynamic_des import JsonlStorageEgress, ParquetStorageEgress

              JsonlStorageEgress(default_path="data/events.jsonl")
              ParquetStorageEgress(default_path="data/events.parquet")

              # Both writers import pyarrow lazily inside their run loops, so
              # constructing them does not prove pyarrow is installed.
              import pyarrow.parquet
              from pyarrow import fs
          - extra: dashboard
            check: |
              from dynamic_des.examples.kafka_dashboard import run

              assert callable(run)
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install only the ${{ matrix.extra }} extra
        run: |
          uv venv --python 3.12
          uv pip install ".[${{ matrix.extra }}]"

      - name: Import and construct the ${{ matrix.extra }} connectors
        env:
          CHECK: ${{ matrix.check }}
        run: .venv/bin/python -c "$CHECK"

  docs:
    needs: [unit-test, integration-test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Mike needs the full history to pull the gh-pages branch

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build and Deploy Docs (Versioned)
        run: |
          # Configure Git for the bot commit
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Dynamically extract the version string from pyproject.toml
          VERSION=$(grep -m 1 '^version = ' pyproject.toml | cut -d '"' -f 2)
          echo "Extracted version: $VERSION"

          # Deploy the extracted version and tag it as 'latest'
          uv run mike deploy --push --update-aliases $VERSION latest

          # Set 'latest' as the default landing page when navigating to the root URL
          uv run mike set-default --push latest
