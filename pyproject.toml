[project]
name = "dynamic-des"
version = "0.14.0"
description = "A dynamic, real-time control plane for SimPy-based discrete-event digital twins."
readme = "README.md"
authors = [
    { name = "Jaehyeon Kim", email = "dottami@gmail.com" }
]
keywords = [
    "simpy",
    "simulation",
    "digital-twin",
    "discrete-event-simulation",
    "kafka",
    "redis",
    "postgres",
    "real-time",
    "industry-4-0"
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "simpy>=4.0.0",
    "numpy>=1.26.0",
    "orjson>=3.10.0",
    "pydantic>=2.0.0"
]

[project.urls]
Homepage = "https://jaehyeon.me/dynamic-des/"
Repository = "https://github.com/jaehyeon-kim/dynamic-des"
Documentation = "https://jaehyeon.me/dynamic-des/"
Issues = "https://github.com/jaehyeon-kim/dynamic-des/issues"

[project.optional-dependencies]
kafka =[
    "aiokafka[lz4]>=0.11.0",
    "kafka-python>=2.0.2"
]
redis = ["redis>=5.0.0"]
postgres =["asyncpg>=0.29.0"]
confluent = [
    # ConfluentAvroSerializer lives in the Kafka connector module, so the kafka
    # extra is required for `pip install dynamic-des[confluent]` to be usable.
    "dynamic-des[kafka]",
    # The schemaregistry and avro extras carry httpx and fastavro, which
    # confluent-kafka stopped bundling in 2.6. Without them the registry client
    # cannot be imported at all.
    "confluent-kafka[schemaregistry,avro]>=2.6",
    "dataclasses-avroschema[pydantic]"
]
glue = [
    "dynamic-des[kafka]",
    "aws-glue-schema-registry",
    "boto3",
    "dataclasses-avroschema[pydantic]",
    # aws_schema_registry.adapter.kafka imports the kafka package
    "kafka-python>=2.0.2"
]
parquet = [
    "pyarrow>=14.0.0"
]
iceberg = [
    # pyiceberg reads and writes through pyarrow, and its own pyarrow extra is what
    # pins a compatible pair. Writing is not possible without it.
    #
    # 0.7.0 is the oldest release the integration tests pass against, so it is the
    # floor. Everything the connector calls has been there since then. A newer
    # pin elsewhere still resolves: odctl's airflow image asks for 0.11.1, and on
    # Python 3.13 or later only 0.11.0 and above are installable anyway.
    "pyiceberg[pyarrow]>=0.7.0"
]
all = [
    "dynamic-des[kafka,redis,postgres,confluent,glue,parquet,iceberg]"
]
[build-system]
requires = ["uv_build>=0.9.16,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mkdocs<2.0",
    "mkdocs-material>=9.7.4",
    "mkdocstrings[python]>=1.0.3",
    "mike>=2.1.0",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.5",
    # Integration tests and the examples get their containers from odctl. 0.5.1 is
    # the floor: earlier versions created the Valkey user without a channel grant,
    # so RedisIngress could not subscribe (odctl#76).
    "odctl>=0.5.1",
    "pytest-cov>=5.0.0",
    "types-redis>=4.6.0",
]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests that require Docker infrastructure (deselect with '-m \"not integration\"')",
]
