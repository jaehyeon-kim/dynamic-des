repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Must match the ruff floor in pyproject.toml dev dependencies. When the two
    # disagree, whichever formatter ran last wins and the diff flaps.
    rev: v0.15.5
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    # Must match the mypy floor in pyproject.toml dev dependencies, for the same reason.
    rev: v1.19.1
    hooks:
      - id: mypy
        additional_dependencies: [types-orjson, types-redis]
        args: [--ignore-missing-imports]
        # The examples are scripts run by path, not an importable package, so they
        # carry no __init__.py. mypy then sees examples/declarative/history_example.py
        # and examples/imperative/history_example.py as two modules with the same
        # name and refuses to check anything. Type checking is for the library.
        exclude: ^examples/
